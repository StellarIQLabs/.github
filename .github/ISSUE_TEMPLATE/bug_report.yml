name: "Bug Report"
description: "Report a reproducible bug in any StellarIQLabs repo."
labels: ["bug"]
body:
  - type: dropdown
    id: repo
    attributes:
      label: "Repo"
      options: ["stellariq-app", "stellariq-data", "stellariq-contract", "stellariq-infra", ".github"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Commit / Tag"
      placeholder: "e.g. main @ abc1234"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "Reference PRD.md section if this contradicts spec (e.g. PRD.md:430)."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: "Steps to Reproduce"
      value: "1. `pnpm install` / `npm install` ...\n2. Set env keys (list keys, no values): ...\n3. Run: ...\n4. Observe: ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs / Screenshots"
      render: shell
  - type: input
    id: env
    attributes:
      label: "Environment"
      placeholder: "Node 20.11, pnpm 9.15.9, Docker 26, Ubuntu 24.04"
  - type: checkboxes
    id: checks
    attributes:
      label: "Checklist"
      options:
        - label: "I checked existing issues and docs (README, docs/DEVELOPMENT_GUIDE, docs/DEPLOYMENT_GUIDE)."
          required: true
        - label: "I did not paste secrets, .env values, or private keys."
          required: true
