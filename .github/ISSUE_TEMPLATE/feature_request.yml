name: "Feature Request"
description: "Propose a new capability (dashboard, API, adapter, infra)."
labels: ["enhancement"]
body:
  - type: dropdown
    id: repo
    attributes:
      label: "Target Repo"
      options: ["stellariq-app", "stellariq-data", "stellariq-contract", "stellariq-infra", ".github", "cross-repo"]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "What user problem does this solve? Reference PRD.md section if applicable."
      placeholder: "As a wallet developer I need ... because ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposal"
      description: "API sketch, UI mock, or adapter interface."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
  - type: checkboxes
    id: checks
    attributes:
      label: "Checklist"
      options:
        - label: "I checked the Roadmap (docs/ROADMAP.md) and existing issues."
          required: true
